<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Залоджкова Agency</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    header {
      text-align: center;
      padding: 4rem 2rem 2rem;
    }

    header h1 {
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    header p {
      margin-top: 1rem;
      font-size: 1.125rem;
      color: #888;
    }

    .cta {
      margin-top: 2.5rem;
      display: inline-block;
      padding: 0.875rem 2rem;
      background: #f0f0f0;
      color: #0a0a0a;
      font-weight: 600;
      border-radius: 6px;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .cta:hover { opacity: 0.85; }

    footer {
      margin-top: auto;
      padding: 2rem;
      text-align: center;
      font-size: 0.875rem;
      color: #444;
    }
  </style>
</head>
<body>
  <header>
    <h1>Zalozhkova Agency</h1>
    <p>Стратегия. Дизайн. Результат.</p>
    <a href="mailto:hello@zalozhkova.agency" class="cta">Связаться</a>
  </header>

  <footer>
    &copy; 2026 Zalozhkova Agency
  </footer>
</body>
</html>
